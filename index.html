          <div className="md:hidden fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-800 z-40 pb-safe">
            <div className="flex justify-around py-3">
              {[
                { id: 'home', icon: Home, label: 'Главная' },
                { id: 'roster', icon: Users, label: 'Состав' },
                { id: 'matches', icon: Calendar, label: 'Матчи' },
                { id: 'stats', icon: BarChart2, label: 'Стата' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${
                    activeTab === tab.id ? 'text-orange-500' : 'text-slate-500'
                  }`}
                >
                  <tab.icon size={20} />
                  <span className="text-[10px] font-medium">{tab.label}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- VIEWS ---

    function HomeView({ goRoster, goMatches, players }) {
      const topScorers = players.slice(0, 3);
      const lastMatch = matchesData[matchesData.length - 1];

      return (
        <div className="space-y-8 animate-fade-in">
          {/* Hero Section */}
          <div className="relative rounded-3xl overflow-hidden bg-slate-800 border border-slate-700/50 shadow-2xl">
            <div className="absolute inset-0 bg-gradient-to-r from-slate-900 via-slate-900/80 to-transparent z-10"></div>
            <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1546519638-68e109498ffc?q=80&w=2090&auto=format&fit=crop')] bg-cover bg-center opacity-30 mix-blend-luminosity"></div>
            
            <div className="relative z-20 p-8 md:p-16 flex flex-col md:flex-row items-center justify-between gap-8">
              <div className="max-w-2xl">
                <div className="inline-block px-3 py-1 bg-orange-500/20 border border-orange-500/50 text-orange-400 text-sm font-bold rounded-full mb-6 uppercase tracking-wider">
                  ASBL Вторая Лига
                </div>
                <h1 className="text-5xl md:text-7xl font-black text-white leading-tight mb-6 uppercase tracking-tight">
                  Мы — <span className="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-orange-600">Нархоз</span>
                </h1>
                <p className="text-lg md:text-xl text-slate-300 mb-8 max-w-lg leading-relaxed">
                  Официальная статистика, ростер и история матчей баскетбольной команды университета Нархоз.
                </p>
                <div className="flex flex-wrap gap-4">
                  <button onClick={goRoster} className="px-6 py-3 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-400 hover:to-orange-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-orange-500/25 flex items-center gap-2">
                    Состав Команды <ChevronRight size={20} />
                  </button>
                </div>
              </div>

              {/* Next Match Card */}
              <div className="w-full md:w-auto min-w-[300px]">
                <Card className="bg-slate-900/80 border-slate-700 p-6">
                  <div className="text-center mb-6">
                    <h3 className="text-slate-400 text-sm font-bold uppercase tracking-widest mb-1">Следующий матч</h3>
                    <div className="text-2xl font-black text-white">{upcomingMatch.opponent}</div>
                    <div className="text-orange-400 text-sm mt-2 flex items-center justify-center gap-2">
                      <Clock size={16} /> {upcomingMatch.date}
                    </div>
                  </div>
                  <div className="flex items-center justify-center gap-6 mb-6">
                    <div className="w-16 h-16 rounded-full bg-slate-800 flex items-center justify-center border-2 border-slate-700">
                      <Shield className="text-slate-400" size={32} />
                    </div>
                    <div className="text-slate-500 font-black italic">VS</div>
                    <div className="w-16 h-16 rounded-full bg-slate-800 flex items-center justify-center border-2 border-slate-700">
                      <Target className="text-slate-400" size={32} />
                    </div>
                  </div>
                  <button className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-bold text-sm transition-colors">
                    Детали матча
                  </button>
                </Card>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
            {/* Last Match Summary */}
            <Card className="md:col-span-2 p-6 flex flex-col justify-center">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-xl font-bold flex items-center gap-2"><Activity className="text-orange-500"/> Последняя игра</h2>
                <button onClick={goMatches} className="text-sm text-slate-400 hover:text-orange-400 flex items-center">
                  Все матчи <ChevronRight size={16} />
                </button>
              </div>
              
              <div className="flex flex-col md:flex-row items-center justify-between gap-6 bg-slate-900/50 p-6 rounded-xl border border-slate-700/50">
                <div className="flex-1 text-center md:text-right">
                  <div className="text-slate-400 text-sm mb-1">Гости</div>
                  <div className="text-2xl font-black truncate">{lastMatch.opponent}</div>
                </div>
                
                <div className="flex items-center gap-4 px-4 py-2 bg-slate-950 rounded-2xl border border-slate-800 shadow-inner">
                  <span className={`text-3xl font-black ${lastMatch.result === 'L' ? 'text-white' : 'text-slate-500'}`}>
                    {lastMatch.scoreOpp}
                  </span>
                  <span className="text-slate-600 text-sm">-</span>
                  <span className={`text-3xl font-black ${lastMatch.result === 'W' ? 'text-orange-500' : 'text-slate-500'}`}>
                    {lastMatch.scoreNarxoz}
                  </span>
                </div>
                
                <div className="flex-1 text-center md:text-left">
                  <div className="text-slate-400 text-sm mb-1">Хозяева</div>
                  <div className="text-2xl font-black text-orange-400">Нархоз</div>
                </div>
              </div>
              
              <div className="mt-6 flex items-center justify-center gap-4 text-sm">
                 <div className="px-3 py-1 bg-green-500/10 text-green-400 rounded-full border border-green-500/20">Победа</div>
                 <div className="text-slate-400">MVP: <span className="text-white font-bold">{lastMatch.topPlayer}</span></div>
              </div>
            </Card>

            {/* Team Leaders Summary */}
            <Card className="p-6">
              <h2 className="text-xl font-bold flex items-center gap-2 mb-6"><Trophy className="text-yellow-500"/> Лидеры по очкам</h2>
              <div className="space-y-4">
                {topScorers.map((player, idx) => (
                  <div key={player.id} className="flex items-center gap-4 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                    <div className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center font-bold text-slate-400 border border-slate-600 text-sm">
                      #{idx + 1}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="font-bold text-white truncate">{player.name.split(' ')[0]}</div>
                      <div className="text-xs text-slate-400 truncate">{player.name.split(' ').slice(1).join(' ')}</div>
                    </div>
                    <div className="text-right">
                      <div className="text-xl font-black text-orange-500">{player.ppg}</div>
                      <div className="text-[10px] uppercase tracking-wider text-slate-500">PPG</div>
                    </div>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        </div>
      );
    }

    function RosterView({ players, onSelectPlayer }) {
      return (
        <div className="animate-fade-in space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 mb-8">
            <div>
              <h1 className="text-4xl font-black text-white uppercase tracking-tight">Состав Команды</h1>
              <p className="text-slate-400 mt-2">Кликните на карточку игрока для просмотра подробной статистики.</p>
            </div>
            <div className="px-4 py-2 bg-slate-800 rounded-lg text-sm text-slate-300 font-medium border border-slate-700">
              Активных игроков: <span className="text-orange-400 font-bold">{players.length}</span>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            {players.map(player => (
              <Card 
                key={player.id} 
                className="group cursor-pointer hover:border-orange-500/50 hover:shadow-orange-500/10 transition-all duration-300"
              >
                <div onClick={() => onSelectPlayer(player)}>
                  <div className="h-48 bg-slate-900 relative overflow-hidden flex items-end justify-center">
                    <div className="absolute -right-4 -bottom-4 text-8xl font-black text-slate-800/50 italic select-none">
                      {player.id}
                    </div>
                    <div className="w-32 h-32 bg-slate-700 rounded-t-full relative z-10 opacity-50 group-hover:bg-slate-600 transition-colors"></div>
                  </div>
                  
                  <div className="p-5 border-t border-slate-700">
                    <div className="text-xs font-bold text-orange-500 mb-1">{player.age} лет • {player.games} игр</div>
                    <h3 className="text-lg font-bold text-white leading-tight mb-4 group-hover:text-orange-400 transition-colors">
                      {player.name}
                    </h3>
                    
                    <div className="grid grid-cols-3 gap-2 text-center bg-slate-900 rounded-lg p-2 border border-slate-800">
                      <div>
                        <div className="text-lg font-black text-white">{player.ppg}</div>
                        <div className="text-[10px] text-slate-500 font-bold">ОЧК</div>
                      </div>
                      <div>
                        <div className="text-lg font-black text-white">{player.rpg}</div>
                        <div className="text-[10px] text-slate-500 font-bold">ПОД</div>
                      </div>
                      <div>
                        <div className="text-lg font-black text-white">{player.apg}</div>
                        <div className="text-[10px] text-slate-500 font-bold">ПЕР</div>
                      </div>
                    </div>
                  </div>
                </div>
              </Card>
            ))}
          </div>
        </div>
      );
    }

    function MatchesView() {
      return (
        <div className="animate-fade-in max-w-4xl mx-auto space-y-8">
          <div>
            <h1 className="text-4xl font-black text-white uppercase tracking-tight">Расписание и Результаты</h1>
            <p className="text-slate-400 mt-2">Второй круг чемпионата ASBL</p>
          </div>

          <div className="space-y-6">
            {matchesData.slice().reverse().map(match => (
              <MatchCard key={match.id} match={match} />
            ))}
          </div>
        </div>
      );
    }

    function MatchCard({ match }) {
      const [expanded, setExpanded] = useState(false);
      const isWin = match.result === 'W';

      return (
        <Card className={`transition-all duration-300 ${expanded ? 'border-orange-500/30' : ''}`}>
          <div 
            className="p-6 cursor-pointer flex flex-col md:flex-row items-center gap-6"
            onClick={() => setExpanded(!expanded)}
          >
            <div className="flex-shrink-0 w-full md:w-24 text-center md:text-left">
              <div className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">{match.round}</div>
              <div className={`inline-block px-3 py-1 rounded-md text-sm font-black ${
                isWin ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'
              }`}>
                {isWin ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ'}
              </div>
            </div>

            <div className="flex-1 w-full flex items-center justify-center md:justify-start gap-4">
              <div className={`text-xl font-black text-right flex-1 ${match.isHome ? 'text-orange-400' : 'text-slate-300'}`}>
                 {match.isHome ? 'Нархоз' : match.opponent}
              </div>
              
              <div className="flex items-center px-4 py-2 bg-slate-900 rounded-xl border border-slate-700">
                <span className={`text-2xl font-black ${match.isHome ? 'text-orange-400' : 'text-slate-300'}`}>
                  {match.isHome ? match.scoreNarxoz : match.scoreOpp}
                </span>
                <span className="mx-2 text-slate-600">-</span>
                <span className={`text-2xl font-black ${!match.isHome ? 'text-orange-400' : 'text-slate-300'}`}>
                  {!match.isHome ? match.scoreNarxoz : match.scoreOpp}
                </span>
              </div>
              
              <div className={`text-xl font-black text-left flex-1 ${!match.isHome ? 'text-orange-400' : 'text-slate-300'}`}>
                {!match.isHome ? 'Нархоз' : match.opponent}
              </div>
            </div>

            <div className="flex-shrink-0">
              <ChevronDown className={`text-slate-500 transition-transform ${expanded ? 'rotate-180' : ''}`} />
            </div>
          </div>

          {expanded && (
            <div className="border-t border-slate-700/50 p-6 bg-slate-900/30">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <div>
                  <h4 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">По четвертям</h4>
                  <div className="flex gap-2 text-center">
                    <div className="flex-1">
                      <div className="text-xs text-slate-500 mb-1">Команда</div>
                      <div className="font-bold text-sm h-8 flex items-center justify-center text-orange-400 border-b border-slate-800">Нархоз</div>
                      <div className="font-bold text-sm h-8 flex items-center justify-center text-slate-300">Соперник</div>
                    </div>
                    {match.quarters.map((q, i) => (
                      <div key={i} className="flex-1 bg-slate-800/50 rounded-lg pb-1">
                        <div className="text-xs font-bold text-slate-500 bg-slate-800 rounded-t-lg py-1 mb-1">Q{i+1}</div>
                        <div className={`font-black text-sm h-7 flex items-center justify-center ${q.n > q.o ? 'text-green-400' : q.n < q.o ? 'text-red-400' : 'text-slate-400'}`}>{q.n}</div>
                        <div className={`font-black text-sm h-7 flex items-center justify-center ${q.o > q.n ? 'text-green-400' : q.o < q.n ? 'text-red-400' : 'text-slate-400'}`}>{q.o}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div>
                  <h4 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Ключевые выводы</h4>
                  <ul className="space-y-3">
                    {match.takeaways.map((t, i) => (
                      <li key={i} className="flex gap-3 items-start text-sm text-slate-300">
                        <TrendingUp size={16} className="text-orange-500 shrink-0 mt-0.5" />
                        <span>{t}</span>
                      </li>
                    ))}
                    <li className="flex gap-3 items-start text-sm text-slate-300">
                      <Trophy size={16} className="text-yellow-500 shrink-0 mt-0.5" />
                      <span>MVP Матча: <strong className="text-white">{match.mvp}</strong></span>
                    </li>
                  </ul>
                </div>
              </div>

              <div>
                <h4 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Статистика игроков (Нархоз)</h4>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm text-left">
                    <thead className="text-xs text-slate-500 uppercase bg-slate-900 rounded-lg">
                      <tr>
                        <th className="px-4 py-3 rounded-l-lg">Игрок</th>
                        <th className="px-4 py-3 text-center">ОЧК</th>
                        <th className="px-4 py-3 text-center">ПОД</th>
                        <th className="px-4 py-3 text-center">ПЕР</th>
                        <th className="px-4 py-3 text-center rounded-r-lg">БЛК</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {match.stats.sort((a,b) => b.pts - a.pts).map((p, i) => (
                        <tr key={i} className="hover:bg-slate-800/50 transition-colors">
                          <td className="px-4 py-3 font-medium text-slate-200">
                            {p.name}
                            {p.name === match.topPlayer && <Trophy size={12} className="inline ml-2 text-yellow-500" />}
                          </td>
                          <td className={`px-4 py-3 text-center font-bold ${p.pts > 0 ? 'text-orange-400' : 'text-slate-600'}`}>{p.pts > 0 ? p.pts : '-'}</td>
                          <td className={`px-4 py-3 text-center ${p.reb > 0 ? 'text-slate-300' : 'text-slate-600'}`}>{p.reb > 0 ? p.reb : '-'}</td>
                          <td className={`px-4 py-3 text-center ${p.ast > 0 ? 'text-slate-300' : 'text-slate-600'}`}>{p.ast > 0 ? p.ast : '-'}</td>
                          <td className={`px-4 py-3 text-center ${p.blk > 0 ? 'text-slate-300' : 'text-slate-600'}`}>{p.blk > 0 ? p.blk : '-'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </Card>
      );
    }

    // --- COMPLETED STATS VIEW ---
    function StatsView({ players }) {
      const topScorers = [...players].sort((a, b) => b.points - a.points).slice(0, 5);
      const topRebounds = [...players].sort((a, b) => b.rebounds - a.rebounds).slice(0, 5);
      const topAssists = [...players].sort((a, b) => b.assists - a.assists).slice(0, 5);

      return (
        <div className="animate-fade-in space-y-8">
          <div>
            <h1 className="text-4xl font-black text-white uppercase tracking-tight">Командная Статистика</h1>
            <p className="text-slate-400 mt-2">Топ-5 лидеров команды по ключевым показателям</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <Card className="p-6">
              <h3 className="text-xl font-black text-white mb-4 flex items-center gap-2">
                <Target className="text-orange-500" /> Очки
              </h3>
              <div className="space-y-3">
                {topScorers.map((p, i) => (
                  <div key={p.id} className="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg border border-slate-700/50">
                    <span className="text-sm font-medium text-slate-300">{i + 1}. {p.name}</span>
                    <span className="text-lg font-bold text-orange-400">{p.points}</span>
                  </div>
                ))}
              </div>
            </Card>

            <Card className="p-6">
              <h3 className="text-xl font-black text-white mb-4 flex items-center gap-2">
                <Shield className="text-orange-500" /> Подборы
              </h3>
              <div className="space-y-3">
                {topRebounds.map((p, i) => (
                  <div key={p.id} className="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg border border-slate-700/50">
                    <span className="text-sm font-medium text-slate-300">{i + 1}. {p.name}</span>
                    <span className="text-lg font-bold text-white">{p.rebounds}</span>
                  </div>
                ))}
              </div>
            </Card>

            <Card className="p-6">
              <h3 className="text-xl font-black text-white mb-4 flex items-center gap-2">
                <TrendingUp className="text-orange-500" /> Передачи
              </h3>
              <div className="space-y-3">
                {topAssists.map((p, i) => (
                  <div key={p.id} className="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg border border-slate-700/50">
                    <span className="text-sm font-medium text-slate-300">{i + 1}. {p.name}</span>
                    <span className="text-lg font-bold text-white">{p.assists}</span>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        </div>
      );
    }

    // --- RENDER APP ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
